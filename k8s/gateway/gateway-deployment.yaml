apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:3001"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:3002"
            - name: RATING_SERVICE_URL
              value: "http://rating-service:3003"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3004"