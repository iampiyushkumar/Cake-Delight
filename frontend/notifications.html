<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cake Delight | Notifications</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar">
      <a class="brand" href="./index.html" aria-label="Cake Delight home">
        <span class="brand-mark">CD</span>
        <span class="brand-text">Cake Delight</span>
      </a>

      <nav class="nav-links" aria-label="Primary navigation">
        <a href="./index.html" class="nav-link">Home</a>
        <a href="./basket.html" class="nav-link">Basket</a>
        <a href="./notifications.html" class="nav-link active">Notifications</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="section-header">
      <div>
        <p class="section-label">Updates</p>
        <h2>Notifications</h2>
      </div>
      <p id="notificationStatus" class="muted-text">Search by user id to load notifications.</p>
    </div>

    <section class="notification-panel">
      <form id="notificationForm" class="notification-toolbar">
        <label class="field">
          <span>User Id</span>
          <input id="notificationUserId" class="notification-input" type="text" placeholder="Enter user id" required />
        </label>
        <button type="submit" class="btn btn-primary">Load Notifications</button>
      </form>

      <div id="notificationList" class="notification-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/notification.js"></script>
</body>
</html>
